name: Build Daqesh APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'daqesh-apk/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: daqesh-apk
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daqesh-pro-apk
          path: daqesh-apk/app/build/outputs/apk/debug/app-debug.apk
